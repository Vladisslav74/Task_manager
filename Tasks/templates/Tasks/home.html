<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
</head>
<body>
<form method="POST">
    {% csrf_token %}

    <label for="name_task">Название задачи:</label>
    <input type="text" name="title" id="name_task" required>

    <label for="description">Доп. информация:</label>
    <input type="text" name="text" id=description>

    <label for="task_priority">приоритет(1-5):</label>
    <input type="number" name="priority" id="task_priority" min="1" max="5" value="1">

    <button type="submit" name="add_task">Добавить задачу</button>
</form>
{% for task in tasks %}
<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
    <span>{{ task.title }} | приоритет: {{ task.priority }}</span>

    <form method="POST" style="margin: 0;">
        {% csrf_token %}
        <input type="hidden" name="task_id" value="{{ task.id }}">
        <button type="submit" name="complete_task">Выполнено</button>
    </form>

        <a href="{% url 'delete_task' task.id %}" style="text-decoration: none;">
            <button type="button">Удалить</button>
        </a>
</div>
{% empty %}
    <p>У вас пока нету задач</p>
{% endfor %}
</body>
</html>
